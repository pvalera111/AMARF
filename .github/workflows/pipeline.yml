name: AMARF Core Build Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code via Safe Action
      uses: actions/checkout@v4
      with:
        # Офіційний фікс 2026 року: примусове виконання кроку на Node 24
        force-javascript-actions-to-node24: true

    - name: Set up Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        # Повторюємо захисний фікс Node 24 для кроку налаштування мови
        force-javascript-actions-to-node24: true

    - name: Install Framework Matrix Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff numpy torch transformers

    - name: Strict Quality Code Check via Ruff
      run: |
        ruff check .

    - name: Run Mock Deployment Verification
      run: |
        python workflow.py --mock-mode
