name: AMARF Pipeline
on:
  push:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Ingest Code via Pure Web API
      run: |
        curl -L -H "Authorization: token ${{ github.token }}" https://github.com{{ github.repository }}/archive/${{ github.sha }}.tar.gz -o repo.tar.gz
        tar -xzf repo.tar.gz --strip-components=1

    - name: Verify Environment
      run: |
        python3 --version

    - name: Install Matrix
      run: |
        python3 -m pip install --upgrade pip
        pip3 install ruff numpy torch transformers

    - name: Run Quality Linter
      run: |
        ruff check .

    - name: Verify Architecture
      run: |
        python3 workflow.py --mock-mode
