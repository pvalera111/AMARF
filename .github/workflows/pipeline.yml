name: AMARF Pipeline
on:
  push:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Secure Shallow Ingestion
      run: |
        git config --global --add safe.directory '*'
        git clone --depth 1 https://x-access-token:${{ github.token }}@://github.com{{ github.repository }}.git .

    - name: Verify Environment
      run: |
        python3 --version

    - name: Install Matrix
      run: |
        python3 -m pip install --upgrade pip
        pip3 install ruff numpy torch transformers

    - name: Run Quality Linter
      run: |
        ruff check .

    - name: Verify Architecture
      run: |
        python3 workflow.py --mock-mode
