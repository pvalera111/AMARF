name: AMARF Core Build Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4.1.7

    - name: Set up Python Runtime Env
      uses: actions/setup-python@v5.1.1
      with:
        python-version: '3.12'

    - name: Install Framework Core Matrix Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff numpy torch transformers

    - name: Strict Quality Code Check via Ruff
      run: ruff check .

    - name: Run Mock Deployment Verification
      run: python workflow.py --mock-mode
