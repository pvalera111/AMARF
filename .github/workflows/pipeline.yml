name: AMARF Pipeline
on:
  push:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    # ОФІЦІЙНИЙ ФІКС GITHUB CLI 2026: Завантаження коду без аргументів шляху
    - name: Ingest Code via Native Artifact API
      run: |
        gh run download --repo $GITHUB_REPOSITORY
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Verify Environment
      run: |
        python3 --version

    - name: Install Matrix
      run: |
        python3 -m pip install --upgrade pip
        pip3 install ruff numpy torch transformers

    - name: Run Quality Linter
      run: |
        ruff check . --fix || true

    - name: Verify Architecture
      run: |
        mkdir -p data
        echo '{"agent_name":"Test","agent_idea":"Test","guardrails":{"allowed_commands":["ping"],"blocked_patterns":["rm"]},"knowledge_chunks":[{"content":"Test command: ping 127.0.0.1","syntax_type":"text"}],"test_suite":{"user_query":"test"}}' > data/sql_theme.json
        python3 workflow.py --mock-mode
