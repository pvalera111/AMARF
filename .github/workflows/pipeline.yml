name: AMARF Core Build Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Ingest Code via Native Git
      run: |
        git clone https://github.com{{ github.repository }}.git .
        git checkout ${{ github.sha }}

    - name: Verify System Python Environment
      run: |
        python3 --version

    - name: Install Matrix Dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install ruff numpy torch transformers

    - name: Strict Quality Code Check via Ruff
      run: |
        ruff check .

    - name: Run Mock Deployment Verification
      run: |
        python3 workflow.py --mock-mode
