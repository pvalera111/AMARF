name: AMARF Pipeline
on:
  push:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    # ОФІЦІЙНИЙ ФІКС ЧЕРЕЗ GITHUB CLI: Завантаження та розпакування в один хід
    - name: Ingest Code via Native GitHub CLI
      run: |
        gh repo archive $GITHUB_REPOSITORY repo.zip
        unzip -q repo.zip
        mv *-$GITHUB_SHA/* . 2>/dev/null || mv AMARF-*/* . 2>/dev/null || true
        rm -rf repo.zip
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Verify Environment
      run: |
        python3 --version

    - name: Install Matrix
      run: |
        python3 -m pip install --upgrade pip
        pip3 install ruff numpy torch transformers

    - name: Run Quality Linter
      run: |
        ruff check . --fix || true

    - name: Verify Architecture
      run: |
        mkdir -p data
        echo '{"agent_name":"Test","agent_idea":"Test","guardrails":{"allowed_commands":["ping"],"blocked_patterns":["rm"]},"knowledge_chunks":[{"content":"Test command: ping 127.0.0.1","syntax_type":"text"}],"test_suite":{"user_query":"test"}}' > data/sql_theme.json
        python3 workflow.py --mock-mode
